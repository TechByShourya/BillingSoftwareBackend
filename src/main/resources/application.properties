spring.application.name=BillingSoftware
server.port=8080

# Keep the API runnable on in-memory sample data until PostgreSQL
# connection details are added in a later step.
spring.autoconfigure.exclude=\
org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration

# PostgreSQL placeholder configuration for later:
spring.datasource.url=jdbc:postgresql://localhost:5432/billing_software
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Subscription-owner login for the app.
# Change these values before production deployment.
app.auth.owner-email=owner@billingsoftware.com
app.auth.owner-password=ChangeMe123!
app.auth.owner-name=Subscription Owner
app.auth.subscription-plan=Premium
app.auth.jwt-secret=BillingSoftwareJwtSecretKeyForOwnersOnly2026KeepThisSafe123456
app.auth.jwt-expiration-minutes=120
