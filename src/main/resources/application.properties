spring.application.name=BillingSoftware

# Use the PORT environment variable set by Render (defaults to 8080 locally)
server.port=${PORT:8080}

# PostgreSQL configuration — uses DATABASE_URL env var on Render, falls back to localhost for local dev
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/billing_software}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Subscription-owner login for the app.
# Change these values before production deployment.
app.auth.owner-email=owner@billingsoftware.com
app.auth.owner-password=ChangeMe123!
app.auth.owner-name=Subscription Owner
app.auth.subscription-plan=Premium
app.auth.jwt-secret=BillingSoftwareJwtSecretKeyForOwnersOnly2026KeepThisSafe123456
app.auth.jwt-expiration-minutes=120
