spring.application.name=BillingSoftware

# Use the PORT environment variable set by Render (defaults to 8080 locally)
server.port=${PORT:8080}

# PostgreSQL configuration
# On Render, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# Spring Boot automatically maps SPRING_DATASOURCE_* env vars to spring.datasource.* properties
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_software}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Subscription-owner login for the app.
# On Render, set APP_AUTH_OWNER_EMAIL, APP_AUTH_OWNER_PASSWORD, etc.
app.auth.owner-email=${APP_AUTH_OWNER_EMAIL:owner@billingsoftware.com}
app.auth.owner-password=${APP_AUTH_OWNER_PASSWORD:ChangeMe123!}
app.auth.owner-name=${APP_AUTH_OWNER_NAME:Subscription Owner}
app.auth.subscription-plan=${APP_AUTH_SUBSCRIPTION_PLAN:Premium}
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:BillingSoftwareJwtSecretKeyForOwnersOnly2026KeepThisSafe123456}
app.auth.jwt-expiration-minutes=${APP_AUTH_JWT_EXPIRATION_MINUTES:120}
